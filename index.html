<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Formulario de registro para la plataforma de cursos online Julio Aprende.">
    <title>Registro - Julio Aprende | Plataforma de Cursos Online</title>
  </head>
  <body>

    <!-- Encabezado del formulario -->
    <header>
      <h1>Julio Aprende</h1>
      <p>Regístrate y comienza a aprender programación web desde cero.</p>
    </header>

    <!-- Contenido principal: formulario de registro -->
    <main>
      <form action="/registro" method="POST" autocomplete="on" novalidate>

        <!-- Fieldset 1: Información Personal -->
        <fieldset>
          <legend>Información Personal</legend>

          <!-- Nombre -->
          <label for="nombre">Nombre *</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Ej: Julio"
            autocomplete="given-name"
            required
            autofocus>

          <!-- Apellido -->
          <label for="apellido">Apellido *</label>
          <input
            type="text"
            id="apellido"
            name="apellido"
            placeholder="Ej: Castellanos"
            autocomplete="family-name"
            required>

          <!-- Correo -->
          <label for="email">Correo Electrónico *</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="ejemplo@correo.com"
            autocomplete="email"
            required>

          <!-- Teléfono -->
          <label for="telefono">Teléfono *</label>
          <input
            type="tel"
            id="telefono"
            name="telefono"
            placeholder="+57 300 123 4567"
            pattern="[+][0-9]{2} [0-9]{3} [0-9]{3} [0-9]{4}"
            autocomplete="tel"
            aria-describedby="telefono-hint"
            required>
          <small id="telefono-hint">Formato: +57 300 123 4567</small>

          <!-- Fecha de nacimiento -->
          <label for="fecha-nacimiento">Fecha de Nacimiento *</label>
          <input
            type="date"
            id="fecha-nacimiento"
            name="fecha_nacimiento"
            min="1940-01-01"
            max="2008-12-31"
            required>

          <!-- Género -->
          <fieldset>
            <legend>Género *</legend>
            <input type="radio" id="genero-m" name="genero" value="masculino" required>
            <label for="genero-m">Masculino</label>
            <input type="radio" id="genero-f" name="genero" value="femenino">
            <label for="genero-f">Femenino</label>
            <input type="radio" id="genero-otro" name="genero" value="otro">
            <label for="genero-otro">Otro</label>
          </fieldset>

        </fieldset>

        <!-- Aquí irán los fieldsets siguientes -->

      </form>
    </main>

    <!-- Pie de página -->
    <footer>
      <p>&copy; 2026 Julio Aprende. Todos los derechos reservados.</p>
    </footer>

  </body>
</html>
